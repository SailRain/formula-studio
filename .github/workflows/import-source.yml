name: Import verified Formula Studio source
on:
  workflow_dispatch:
    inputs:
      archive_sha256:
        description: SHA-256 of the verified formula-studio-source.tar.gz draft asset
        required: true
        type: string
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Import the verified source snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.archive_sha256 }}
        run: |
          set -euo pipefail
          asset_id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft == true and .name == "Formula Studio v1.0.0") | .assets[] | select(.name == "formula-studio-source.tar.gz") | .id')
          test -n "$asset_id"
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" -H 'Accept: application/octet-stream' > /tmp/formula-studio-source.tar.gz
          printf '%s  %s\n' "$EXPECTED_SHA" '/tmp/formula-studio-source.tar.gz' | sha256sum --check -
          mkdir /tmp/formula-studio-import
          tar -xzf /tmp/formula-studio-source.tar.gz -C /tmp/formula-studio-import --no-same-owner
          rsync -a --exclude=.github/workflows/ /tmp/formula-studio-import/formula-studio/ ./
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish verified Formula Studio source and GitHub Pages workflow'
          git push origin HEAD:main
